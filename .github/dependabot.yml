version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Type definitions must match the Node runtime major (CI and engines: Node 24 LTS), not the newest release.
      # Raise this together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /companion
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
