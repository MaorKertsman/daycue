name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag format and signing secrets
        env:
          KS_B64: ${{ secrets.DAYCUE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DAYCUE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DAYCUE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DAYCUE_KEY_PASSWORD }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must look like v1.2.3"
            exit 1
          fi
          missing=""
          [ -n "$KS_B64" ]   || missing="$missing DAYCUE_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ]  || missing="$missing DAYCUE_KEYSTORE_PASSWORD"
          [ -n "$KS_ALIAS" ] || missing="$missing DAYCUE_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing DAYCUE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Refusing to build a release: it would be signed with the debug key. See docs/setup/BUILD.md."
            exit 1
          fi

      - name: Check tag matches versionName
        working-directory: android/app
        run: |
          name=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)".*/\1/p' build.gradle.kts | head -n1)
          if [ "v$name" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match versionName '$name' in android/app/build.gradle.kts (bump versionCode and versionName first)."
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-disabled: true # release artifacts never share a build cache

      - name: Install Android platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.DAYCUE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/daycue-release.jks"
          echo "DAYCUE_KEYSTORE_FILE=$RUNNER_TEMP/daycue-release.jks" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Domain tests and signed release build
        env:
          DAYCUE_KEYSTORE_PASSWORD: ${{ secrets.DAYCUE_KEYSTORE_PASSWORD }}
          DAYCUE_KEY_ALIAS: ${{ secrets.DAYCUE_KEY_ALIAS }}
          DAYCUE_KEY_PASSWORD: ${{ secrets.DAYCUE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :domain:test :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signature
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --verbose --print-certs "${apks[0]}" | tee "$RUNNER_TEMP/certs.txt"
          # Gradle silently falls back to the debug key when signing is incomplete.
          if grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK is signed with the Android debug key; refusing to publish."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp "${apks[0]}" "$RUNNER_TEMP/out/daycue-${RELEASE_TAG#v}.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daycue-release
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/daycue-release.jks"

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write; it never sees the signing secrets.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daycue-release
          path: release

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: DayCue ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
