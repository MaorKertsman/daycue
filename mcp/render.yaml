# Render Blueprint for the DayCue relay. NOT deployed by the engineer; the delivery lead deploys.
# This is the DURABLE configuration: a paid Starter web service (never spins down) + a 1 GB persistent
# disk holding the JSON store. Free web services cannot attach disks and spin down after 15 min idle;
# free Postgres expires after 30 days; free Key Value is not persisted. See docs/architecture/RELAY.md.
# Verify the plan name and prices in the Render dashboard before applying.
services:
  - type: web
    name: daycue-relay
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: mcp
    buildCommand: npm ci && npm run build
    startCommand: node dist/node/server.js
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    disk:
      name: relay-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DAYCUE_DATA_FILE
        value: /var/data/relay.json
      - key: DAYCUE_OWNER_SECRET
        sync: false # owner enters it in the dashboard; never in git. Generate with: npm run gen-secret (the relay refuses weak secrets)
      - key: DAYCUE_TRUSTED_PROXY_HOPS
        value: 1 # Render's proxy appends the client address to X-Forwarded-For; per-source throttling relies on it
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false # optional, only when push is set up
