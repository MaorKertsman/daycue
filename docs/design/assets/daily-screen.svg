<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 800" width="760" height="800" font-family="Rubik, Arial, sans-serif">
  <!-- DayCue daily screen sketch, 360dp wide frames. Left: English LTR. Right: Hebrew RTL (mirrored composition, text not mirrored). Synthetic data. Original work. -->
  <defs>
    <!-- The Field, authored in LTR coordinates (x 0..360) -->
    <g id="field">
      <g transform="rotate(-3 140.5 190)">
        <rect x="29" y="112" width="223" height="156" rx="6" fill="#E2D4BA"/>
        <!-- active posture mode: standing slab, 60% elapsed as rising fill -->
        <rect x="51.75" y="180.75" width="22.5" height="70.5" rx="2" fill="#F4EFE6"/>
        <rect x="51" y="208.8" width="24" height="43.2" fill="#86A97F"/>
        <rect x="51.75" y="180.75" width="22.5" height="70.5" rx="2" fill="none" stroke="#3B6337" stroke-width="1.5"/>
      </g>
      <!-- next cue disc approaching the plane (p = 0.6) -->
      <circle cx="281" cy="160" r="30" fill="#5E9EA8"/>
      <!-- now line -->
      <rect x="0" y="275" width="360" height="1.5" fill="#1F1D1A" fill-opacity="0.2"/>
    </g>
    <g id="chrome">
      <!-- hairlines and shapes that mirror: row hairlines, button frames, nav indicator -->
      <rect x="20" y="380" width="150" height="52" rx="14" fill="#1F1D1A"/>
      <rect x="182.75" y="380.75" width="156.5" height="50.5" rx="14" fill="none" stroke="#8A8276" stroke-width="1.5"/>
      <rect x="20" y="477" width="12" height="3" rx="1.5" fill="#57524A"/>
      <rect x="76" y="560" width="284" height="1" fill="#D8D0C2"/>
      <rect x="76" y="624" width="284" height="1" fill="#D8D0C2"/>
      <!-- row marks (28dp in 40dp slot) -->
      <g transform="translate(26,506) scale(1.1667)">
        <circle cx="13" cy="10" r="6.5" fill="#E3A72F"/><rect x="3" y="15" width="18" height="4" rx="2" fill="#7F5300"/>
      </g>
      <g transform="translate(26,570) scale(1.1667)">
        <g transform="rotate(-35 12 12)"><path d="M12 8 H7 A4 4 0 0 0 7 16 H12 Z" fill="#A8739A"/><path d="M12 8 H17 A4 4 0 0 1 17 16 H12 Z" fill="#7A3B6A"/></g>
      </g>
      <g transform="translate(26,640) scale(1.1667)">
        <rect x="5" y="5" width="14" height="14" rx="1" transform="rotate(45 12 12)" fill="#A3242B"/>
      </g>
      <!-- bottom nav -->
      <rect x="0" y="720" width="360" height="1" fill="#D8D0C2"/>
      <rect x="50" y="730" width="20" height="4" rx="2" fill="#1F1D1A"/>
      <circle cx="60" cy="752" r="9" fill="#1F1D1A"/>
      <g fill="none" stroke="#57524A" stroke-width="1.75">
        <rect x="171" y="743" width="18" height="18" rx="3"/>
        <circle cx="300" cy="752" r="9"/>
      </g>
    </g>
  </defs>

  <rect width="760" height="800" fill="#FFFFFF"/>

  <!-- ===== LTR frame ===== -->
  <svg x="0" y="0" width="360" height="800" viewBox="0 0 360 800" overflow="hidden">
    <rect width="360" height="800" fill="#F4EFE6"/>
    <use xlink:href="#field"/>
    <use xlink:href="#chrome"/>
    <text x="20" y="38" font-size="14" fill="#57524A">Sun 4 Oct · 12:20</text>
    <text x="20" y="66" font-size="20" font-weight="500" fill="#1F1D1A">At home · desk work</text>
    <circle cx="324" cy="52" r="12" fill="none" stroke="#57524A" stroke-width="1.75"/>
    <text x="20" y="328" font-size="28" font-family="'Frank Ruhl Libre', Georgia, serif" font-weight="500" fill="#1F1D1A">Drink a glass of water</text>
    <text x="20" y="356" font-size="16" fill="#245F68">Due now</text>
    <text x="92" y="356" font-size="16" fill="#57524A">· last at 10:40</text>
    <text x="95" y="411" font-size="16" font-weight="500" fill="#F4EFE6" text-anchor="middle">Done</text>
    <text x="261" y="411" font-size="16" font-weight="500" fill="#1F1D1A" text-anchor="middle">Snooze 15 min</text>
    <text x="40" y="484" font-size="14" font-weight="500" fill="#57524A">Next</text>
    <text x="76" y="522" font-size="16" fill="#1F1D1A">Sunscreen</text>
    <text x="76" y="544" font-size="14" fill="#57524A">13:00 · in 40 min · leaving home</text>
    <text x="76" y="586" font-size="16" fill="#1F1D1A">Medication B</text>
    <text x="76" y="608" font-size="14" fill="#57524A">20:00 · confirm on phone</text>
    <text x="76" y="650" font-size="16" fill="#1F1D1A">Exact alarms are off</text>
    <text x="76" y="672" font-size="14" fill="#A3242B">Reminders may be late · Fix</text>
    <text x="60" y="784" font-size="12" font-weight="500" fill="#1F1D1A" text-anchor="middle">Today</text>
    <text x="180" y="784" font-size="12" fill="#57524A" text-anchor="middle">Cues</text>
    <text x="300" y="784" font-size="12" fill="#57524A" text-anchor="middle">Setup</text>
  </svg>

  <!-- ===== RTL frame: same composition mirrored, Hebrew text right-aligned ===== -->
  <svg x="400" y="0" width="360" height="800" viewBox="0 0 360 800" overflow="hidden">
    <rect width="360" height="800" fill="#F4EFE6"/>
    <g transform="translate(360,0) scale(-1,1)">
      <use xlink:href="#field"/>
      <use xlink:href="#chrome"/>
    </g>
    <text x="340" y="38" font-size="14" fill="#57524A" text-anchor="end">יום א׳, 4 באוק׳ · 12:20</text>
    <text x="340" y="66" font-size="20" font-weight="500" fill="#1F1D1A" text-anchor="end">בבית · עבודה ליד השולחן</text>
    <circle cx="36" cy="52" r="12" fill="none" stroke="#57524A" stroke-width="1.75"/>
    <text x="340" y="328" font-size="28" font-family="'Frank Ruhl Libre', Georgia, serif" font-weight="500" fill="#1F1D1A" text-anchor="end">לשתות כוס מים</text>
    <text x="340" y="356" font-size="16" fill="#245F68" text-anchor="end">הגיע הזמן · <tspan fill="#57524A">לאחרונה ב־10:40</tspan></text>
    <text x="265" y="411" font-size="16" font-weight="500" fill="#F4EFE6" text-anchor="middle">בוצע</text>
    <text x="99" y="411" font-size="16" font-weight="500" fill="#1F1D1A" text-anchor="middle">דחייה ב־15 דק׳</text>
    <text x="320" y="484" font-size="14" font-weight="500" fill="#57524A" text-anchor="end">הבא</text>
    <text x="284" y="522" font-size="16" fill="#1F1D1A" text-anchor="end">קרם הגנה</text>
    <text x="284" y="544" font-size="14" fill="#57524A" text-anchor="end">13:00 · בעוד 40 דק׳ · ביציאה מהבית</text>
    <text x="284" y="586" font-size="16" fill="#1F1D1A" text-anchor="end">תרופה ב</text>
    <text x="284" y="608" font-size="14" fill="#57524A" text-anchor="end">20:00 · אישור בטלפון</text>
    <text x="284" y="650" font-size="16" fill="#1F1D1A" text-anchor="end">התראות מדויקות כבויות</text>
    <text x="284" y="672" font-size="14" fill="#A3242B" text-anchor="end">תזכורות עלולות לאחר · לתיקון</text>
    <text x="300" y="784" font-size="12" font-weight="500" fill="#1F1D1A" text-anchor="middle">היום</text>
    <text x="180" y="784" font-size="12" fill="#57524A" text-anchor="middle">תזכורות</text>
    <text x="60" y="784" font-size="12" fill="#57524A" text-anchor="middle">הגדרות</text>
  </svg>
</svg>
