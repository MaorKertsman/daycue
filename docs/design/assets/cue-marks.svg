<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Rubik, Arial, sans-serif">
  <!-- DayCue cue marks, 24-unit grid, drawn at 3x (72px). Light theme tokens. Original work. -->
  <defs>
    <pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="#C2B9AA" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="300" fill="#F4EFE6"/>
  <g font-size="11" fill="#57524A" text-anchor="middle">
    <!-- 1 sunscreen -->
    <g transform="translate(16,20) scale(3)">
      <circle cx="13" cy="10" r="6.5" fill="#E3A72F"/>
      <rect x="3" y="15" width="18" height="4" rx="2" fill="#7F5300"/>
    </g>
    <text x="52" y="110">sunscreen</text>
    <!-- 2 hydration (with fill level 50%) -->
    <g transform="translate(106,20) scale(3)">
      <clipPath id="vessel"><path d="M7 21 V8 A5 5 0 0 1 17 8 V21 Z"/></clipPath>
      <rect x="7" y="13" width="10" height="8" fill="#5E9EA8" clip-path="url(#vessel)"/>
      <path d="M7 21 V8 A5 5 0 0 1 17 8 V21 Z" fill="none" stroke="#245F68" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <text x="142" y="110">hydration</text>
    <!-- 3 posture (standing active) -->
    <g transform="translate(196,20) scale(3)">
      <rect x="2.75" y="14.75" width="5.5" height="5.5" rx="1" fill="none" stroke="#3B6337" stroke-width="1.5"/>
      <rect x="10" y="8" width="4" height="12" rx="1" fill="#86A97F"/>
      <circle cx="19" cy="17" r="2.75" fill="none" stroke="#3B6337" stroke-width="1.5"/>
    </g>
    <text x="232" y="110">posture</text>
    <!-- 4 medication -->
    <g transform="translate(286,20) scale(3)">
      <g transform="rotate(-35 12 12)">
        <path d="M12 8 H7 A4 4 0 0 0 7 16 H12 Z" fill="#A8739A"/>
        <path d="M12 8 H17 A4 4 0 0 1 17 16 H12 Z" fill="#7A3B6A"/>
      </g>
    </g>
    <text x="322" y="110">medication</text>
    <!-- 5 calendar -->
    <g transform="translate(376,20) scale(3)">
      <rect x="4" y="4" width="16" height="16" rx="3" fill="#7F86BF"/>
      <rect x="12.5" y="12.5" width="5" height="5" rx="1" fill="#434B8C"/>
    </g>
    <text x="412" y="110">calendar</text>
    <!-- 6 routine -->
    <g transform="translate(466,20) scale(3)">
      <circle cx="7" cy="12" r="5" fill="#CF7652"/>
      <circle cx="14.5" cy="12" r="3.5" fill="#CF7652" fill-opacity="0.7"/>
      <circle cx="20" cy="12" r="2.25" fill="#963F1E"/>
    </g>
    <text x="502" y="110">routine</text>
    <!-- 7 alarm -->
    <g transform="translate(556,20) scale(3)">
      <path d="M4 19 A8 8 0 0 1 20 19 Z" fill="#3F5A8A" fill-opacity="0.85"/>
      <rect x="2" y="19" width="20" height="2" rx="1" fill="#33507F"/>
      <circle cx="12" cy="6" r="1.75" fill="#33507F"/>
    </g>
    <text x="592" y="110">alarm</text>

    <!-- States, shown on the hydration mark -->
    <text x="320" y="150" font-size="12" fill="#1F1D1A">states (always paired with text)</text>
    <!-- due: full + seed -->
    <g transform="translate(46,165) scale(3)">
      <path d="M7 21 V8 A5 5 0 0 1 17 8 V21 Z" fill="#5E9EA8" stroke="#245F68" stroke-width="1.5"/>
      <circle cx="20.5" cy="3.5" r="2.5" fill="#1F1D1A"/>
    </g>
    <text x="82" y="270">due</text>
    <!-- upcoming -->
    <g transform="translate(166,165) scale(3)">
      <path d="M7 21 V8 A5 5 0 0 1 17 8 V21 Z" fill="#5E9EA8"/>
    </g>
    <text x="202" y="270">scheduled</text>
    <!-- snoozed -->
    <g transform="translate(286,165) scale(3)">
      <path d="M7 21 V8 A5 5 0 0 1 17 8 V21 Z" fill="#9D93B5" stroke="#245F68" stroke-width="1.5"/>
    </g>
    <text x="322" y="270">snoozed</text>
    <!-- paused -->
    <g transform="translate(406,165) scale(3)">
      <path d="M7 21 V8 A5 5 0 0 1 17 8 V21 Z" fill="#B3AA9C"/>
      <rect x="5" y="15" width="14" height="2" rx="1" fill="#5E574E"/>
    </g>
    <text x="442" y="270">paused</text>
    <!-- unknown -->
    <g transform="translate(496,165) scale(3)">
      <path d="M7 21 V8 A5 5 0 0 1 17 8 V21 Z" fill="url(#hatch)" stroke="#5E574E" stroke-width="1.5"/>
    </g>
    <text x="532" y="270">unknown</text>
    <!-- error -->
    <g transform="translate(566,165) scale(3)">
      <path d="M7 21 V8 A5 5 0 0 1 17 8 V21 Z" fill="#5E9EA8"/>
      <rect x="17.5" y="0.5" width="5" height="5" rx="0.75" transform="rotate(45 20 3)" fill="#A3242B"/>
    </g>
    <text x="602" y="270">error</text>
  </g>
</svg>
